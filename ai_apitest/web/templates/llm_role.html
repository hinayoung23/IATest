<div class="llm-card">
  <h3>{{ROLE_LABEL}}</h3>
  {{FALLBACK}}
  <dl class="kv-list">
    <div><dt>Provider</dt><dd>{{PROVIDER_LABEL}}</dd></div>
    <div><dt>Base URL</dt><dd>{{BASE_URL}}</dd></div>
    <div><dt>Model</dt><dd>{{MODEL}}</dd></div>
    <div><dt>API Key</dt><dd>{{API_KEY_DISPLAY}}</dd></div>
    <div><dt>工具调用</dt><dd>{{TOOLS_STATUS}}</dd></div>
  </dl>
  <div class="card-actions">
    <button type="button" onclick="document.getElementById('{{DIALOG_ID}}').showModal()">修改</button>
    <form method="post" action="/actions/test-llm" data-loading-message="{{ROLE_LABEL}}连通性测试中">
      {{HIDDEN_PROJECT}}
      <input type="hidden" name="role" value="{{ROLE}}">
      <button type="submit">测试</button>
    </form>
  </div>
  <dialog id="{{DIALOG_ID}}" class="modal" data-reset-on-close>
    <form method="post" action="/actions/save-llm" class="modal-form">
      {{HIDDEN_PROJECT}}
      <input type="hidden" name="role" value="{{ROLE}}">
      <div class="modal-head">
        <h3>修改{{ROLE_LABEL}}</h3>
        <button type="button" class="ghost" onclick="cancelDialog('{{DIALOG_ID}}')">关闭</button>
      </div>
      <label>Provider<select name="provider">{{PROVIDER_OPTIONS}}</select></label>
      <label>Base URL<input name="base_url" value="{{BASE_URL_VALUE}}"></label>
      <label>Model<input name="model" value="{{MODEL_VALUE}}"></label>
      <label><input type="checkbox" name="supports_tools" {{SUPPORTS_TOOLS_CHECKED}}> Provider 支持原生工具调用</label>
      <label>API Key 或环境变量名
        <div class="api-key-control">
          <input type="text" name="api_key_env" value="" placeholder="{{API_KEY_PLACEHOLDER}}" data-secret-input>
          <button type="button" class="ghost" onclick="toggleSecretInput(this)" data-secret-toggle disabled>隐藏</button>
        </div>
      </label>
      <div class="modal-actions">
        <button type="button" class="ghost" onclick="cancelDialog('{{DIALOG_ID}}')">取消</button>
        <button type="submit">保存配置</button>
      </div>
    </form>
  </dialog>
</div>
