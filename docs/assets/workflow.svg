<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">IATest: from goal to evidence</title>
  <desc id="desc">Describe a goal and trusted outcome, explore with native tools, replay independently, and save reusable assets with assertions and evidence.</desc>
  <rect width="1120" height="260" rx="24" fill="#f5f5f7"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#1d1d1f">
    <text x="40" y="49" font-size="14" fill="#6e6e73" letter-spacing="2">IATest · FROM INTENT TO EVIDENCE</text>
    <g fill="#fff" stroke="#dedee2">
      <rect x="40" y="77" width="230" height="135" rx="16"/>
      <rect x="310" y="77" width="230" height="135" rx="16"/>
      <rect x="580" y="77" width="230" height="135" rx="16"/>
      <rect x="850" y="77" width="230" height="135" rx="16"/>
    </g>
    <g font-size="12" fill="#0066cc"><text x="61" y="106">01 / INTENT</text><text x="331" y="106">02 / EXPLORE</text><text x="601" y="106">03 / VERIFY</text><text x="871" y="106">04 / REUSE</text></g>
    <g font-size="22" font-weight="600"><text x="61" y="143">Goal &amp; outcome</text><text x="331" y="143">Native actions</text><text x="601" y="143">Independent replay</text><text x="871" y="143">Assets &amp; evidence</text></g>
    <g font-size="13" fill="#515154"><text x="61" y="174">Explicit scope. Trusted checks.</text><text x="331" y="174">Observe. Locate. Act.</text><text x="601" y="174">Fresh sessions. Real verdicts.</text><text x="871" y="174">Plans. Assertions. Reports.</text></g>
    <g font-size="26" fill="#6e6e73"><text x="278" y="150">→</text><text x="548" y="150">→</text><text x="818" y="150">→</text></g>
  </g>
</svg>
