name: Publish Python package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux-desktop:
    name: Real X11 AT-SPI acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install X11 and AT-SPI acceptance environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-0 at-spi2-core dbus-x11 xvfb xauth openbox python3-gi gir1.2-gtk-3.0
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation ".[test]"
      - name: Verify real Linux desktop input
        env:
          IATEST_TEST_LINUX_DESKTOP: '1'
        run: xvfb-run -a dbus-run-session -- bash -c 'openbox > /tmp/iatest-openbox.log 2>&1 & python -m pytest -q tests/test_linux_desktop.py'
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: '3.11'}
          - {os: ubuntu-latest, python-version: '3.12'}
          - {os: ubuntu-latest, python-version: '3.13'}
          - {os: ubuntu-latest, python-version: '3.14'}
          - {os: macos-latest, python-version: '3.14'}
          - {os: windows-latest, python-version: '3.14'}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation ".[test,database,hid]"
      - name: Verify project-independent contracts
        run: python -m pytest -q tests/test_project_isolation.py
      - name: Verify Linux browser process budget
        if: runner.os == 'Linux'
        run: python scripts/validate_browser_budget.py
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distribution
    needs: [test, linux-desktop, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build verification tools
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Build wheel and source distribution
        shell: python
        run: |
          import os, subprocess, sys
          epoch = subprocess.check_output(["git", "log", "-1", "--format=%ct"], text=True).strip()
          subprocess.check_call([sys.executable, "-m", "build", "--no-isolation"], env={**os.environ, "SOURCE_DATE_EPOCH": epoch})
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Store distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  install-smoke:
    name: Clean base wheel / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Install only the base wheel and check CLI, process worker and Web assets
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          with tempfile.TemporaryDirectory(prefix="iatest-clean-install-") as temporary:
              target = pathlib.Path(temporary)
              venv.EnvBuilder(with_pip=True).create(target)
              python = target / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
              wheel, = pathlib.Path("dist").glob("*.whl")
              subprocess.check_call([str(python), "-m", "pip", "install", "--require-hashes", "-r", "requirements/base.txt"])
              subprocess.check_call([str(python), "-m", "pip", "install", "--no-deps", str(wheel.resolve())])
              subprocess.check_call([str(python), "-I", "scripts/validate_package_install.py"])

  publish:
    name: Publish distribution to PyPI
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/iatest-framework
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  quality:
    name: Security and quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m coverage run -m pytest -q tests/test_release_hardening.py tests/test_browser_startup.py tests/test_delivery_hardening.py tests/test_safari_policy.py
      - run: python -m coverage report
      - run: python scripts/benchmark_core.py --output benchmark.json
