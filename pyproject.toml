[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "iatest-framework"
version = "1.0.3"
description = "AI-driven API test automation framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wzl" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["api", "automation", "llm", "mock", "testing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "apscheduler>=3.10,<4",
  "httpx[socks]>=0.27,<1",
  "jinja2>=3.1,<4",
  "json-repair>=0.30,<1",
  "jsonpath-ng>=1.7,<2",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
iatest = "ai_apitest.cli:main"

[project.urls]
Homepage = "https://github.com/hinayoung23/IATest"
Repository = "https://github.com/hinayoung23/IATest"
Issues = "https://github.com/hinayoung23/IATest/issues"
Releases = "https://github.com/hinayoung23/IATest/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_apitest*"]

[tool.setuptools.package-data]
ai_apitest = [
  "prompts/*.md",
  "agents/identities/*.yaml",
  "web/static/*.css",
  "web/static/*.js",
  "web/templates/*.html",
]
