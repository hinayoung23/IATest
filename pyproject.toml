[build-system]
requires = ["setuptools>=77.0.3,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "iatest-framework"
version = "2.1.1"
description = "AI-driven API, UI, performance and security test automation framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wzl" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["api", "ui", "performance", "security", "automation", "llm", "testing"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "apscheduler>=3.10,<4",
  "h2>=4.2,<5",
  "httpx[socks]>=0.27,<1",
  "jinja2>=3.1,<4",
  "json-repair>=0.30,<1",
  "jsonschema>=4.23,<5",
  "jsonpath-ng>=1.7,<2",
  "protobuf>=5,<8",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["coverage[toml]>=7.10,<8", "ruff>=0.14,<1", "mypy>=1.18,<2", "build>=1.2,<2", "twine>=6,<7", "setuptools>=77.0.3,<90"]
hid = ["pypinyin>=0.55,<1"]
database = [
  "psycopg[binary]>=3.3,<4",
  "PyMySQL[rsa]>=1.1,<2",
  "sqlglot>=30.24,<31",
]

[project.scripts]
iatest = "iatest.cli:main"

[project.urls]
Homepage = "https://github.com/hinayoung23/IATest"
Repository = "https://github.com/hinayoung23/IATest"
Issues = "https://github.com/hinayoung23/IATest/issues"
Releases = "https://github.com/hinayoung23/IATest/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["iatest*"]

[tool.setuptools.package-data]
iatest = [
  "prompts/*.md",
  "agents/identities/*.yaml",
  "web/static/*.css",
  "web/static/*.js",
  "engines/*.js",
  "engines/*.json",
  "engines/desktop_native/*.swift",
  "engines/desktop_native/*.ps1",
  "engines/desktop_native/*.py",
  "engines/desktop_native/gnome/*.js",
  "engines/desktop_native/gnome/*.json",
  "nodes/*.ps1",
  "web/templates/*.html",
  "mobile/native/THIRD_PARTY_NOTICES.md",
  "mobile/native/android/*.xml",
  "mobile/native/android/res/xml/*.xml",
  "mobile/native/android/src/dev/iatest/mobile/*.java",
  "mobile/native/android-hid/*.xml",
  "mobile/native/android-hid/res/values/*.xml",
  "mobile/native/android-hid/src/dev/iatest/mobile/hid/*.java",
  "mobile/native/android-lab/*.java",
  "mobile/native/android-lab/*.xml",
  "mobile/native/android-lab/*.md",
  "mobile/native/android-lab/res/values/*.xml",
  "mobile/native/bridge/android/*.java",
  "mobile/native/bridge/ios/*.h",
  "mobile/native/bridge/ios/*.m",
  "mobile/native/ios/*.m",
  "mobile/native/ios/*.h",
  "mobile/native/ios/IATestMobile.xcodeproj/project.pbxproj",
  "mobile/native/ios/IATestMobile.xcodeproj/xcshareddata/xcschemes/*.xcscheme",
  "mobile/native/ios/DebugApp/*.m",
  "mobile/native/ios/DebugApp/*.md",
  "mobile/native/ios/DebugApp/IATestDebugApp.xcodeproj/project.pbxproj",
  "mobile/native/ios/DebugApp/IATestDebugApp.xcodeproj/xcshareddata/xcschemes/*.xcscheme",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["iatest/mobile/native", "iatest/engines/desktop_native"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
files = ["iatest/ai/connections.py", "iatest/ai/debug_log.py", "iatest/ai/analysis_outcome.py", "iatest/core/config_schema.py", "iatest/web/security.py", "iatest/engines/browser_wait.py", "iatest/engines/verdicts.py"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["iatest.ai.connections", "iatest.ai.debug_log", "iatest.core.config_schema", "iatest.web.security", "iatest.engines.browser_wait", "iatest.engines.verdicts"]

[tool.coverage.report]
show_missing = true
fail_under = 85
