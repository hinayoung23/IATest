[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iatest"
version = "1.0.0"
description = "AI-driven API test automation framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "wzl" }]
dependencies = [
  "apscheduler>=3.10,<4",
  "httpx[socks]>=0.27,<1",
  "jinja2>=3.1,<4",
  "json-repair>=0.30,<1",
  "jsonpath-ng>=1.7,<2",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
iatest = "ai_apitest.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_apitest*"]

[tool.setuptools.package-data]
ai_apitest = [
  "prompts/*.md",
  "agents/identities/*.yaml",
  "web/static/*.css",
  "web/static/*.js",
  "web/templates/*.html",
]
